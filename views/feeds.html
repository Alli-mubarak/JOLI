<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOLI - Home</title>
   <link rel="stylesheet" href="/styles/tabs.post.css" />
 <link rel="stylesheet" href="/styles/index.css" />
  <link rel="manifest" href="/manifest.json">
  <link rel="shortcut icon" href="images/joli3.png" type="image/x-icon">
  <link rel="apple-touch-icon" href="images/joli3.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <header id="header">
  <a href="/" id="logo">
    <img src="images/joli-light.png" alt="logo" class="logo" />
  </a>
  <div class="side-bar">
    <a href="/" id="sign-in-link" class="hidden" >Sign In</a>
    <img src="/images/default-user.png" alt="profile picture" id="user-pic"  />
  </div>
  </header>
  <main>    
    <section class="posts" id="posts">
      <div class="p-loader"></div>
      <div class="p-loader"></div>
      <div class="p-loader"></div>
      <div class="p-loader"></div>
      <div class="p-loader"></div>
      <div class="p-loader"></div>
      
    </section>
    <article>
      
    </article>
    </main>
  
  <div id="menu-container">
        <div id="m-closer">
            <div>
            <i id="m-closer-btn" class="fa-solid fa-xmark"></i>
            </div>
        </div>
        <div id="menu-options">
            <div id="profile-info">
                <div id="side-header">
                    <img id="profile-pic" alt="profile-pic" src="pic.png">
                    <h3 id="u-name">User</h3>
                    <p id="user-email">Email</p>
                </div>
                  <a href="/api/auth/logout" id="logout-link">
                    Log out
                </a>
            </div>
            <div id="extras">
                  <a href="#">
                    <i class="fa-regular fa-circle-user"></i>
                    Profile
                </a>
            </div>
            <div id="account-settings">
                <a href="#">
                    <i class="fa-solid fa-gear"></i>
                    Account Settings 
                </a>
            </div>
        </div>
  </div>
  
  <div id="notifier" class="hidden">
        <p id="n-message">post created</p>
        <a href="#" id="n-link">view post</a>
        <span id="n-closer">
          <i class="fa-solid fa-xmark"></i>
        </span>
  </div>
   <div id="create-post-container" class="hidden">
        <div class="header">
            <div class="closer" id="p-closer">
            <i id="post-container-closer" class="fa-solid fa-xmark"></i>
            </div>
            <h3>Create Post</h3>
            <button disabled id="post-btn">
              <span>Post</span>
              <div id="p-loader" class="hidden"></div>
            </button>
        </div>
        <div class="user-details">
            <img src="/images/default-user.png" alt="user picture" id="p-user-picture" />
            <p id="p-username">User</p>
        </div>
     <div id="media-adder">
               <div id="cover"></div>
            <label  id="add-media" for="media-upload">
            <i class="fa-regular fa-images"></i>
            </label>
     </div>
        <form>
          
        <div id="media-files-displayer"></div>
            <textarea id="content" name="content" autofocus  placeholder="What's on your mind?"></textarea>
           
            <div id="add-media-files">
                
                
                <input  type="file" accept="image/*" id="media-upload" multiple />
            </div>
        </form>
           
            
        
    </div>
    <div class="hidden" id="image-cropper">
        <button id="crop-saver"><i class="fa-solid fa-check"></i></button>
        <div id="image-box"></div>
  </div>
  <div class="tabs">
        <div dataset="home" class="active" title="home">
           <a href="/">
            <img src="images/home-active.png" class="home tab" alt="home icon"/>
             <span>Home</span>
           </a>
        </div>
          <div dataset="friends" title="friends">
            <a href="/followers">
            <img src="images/friends.png" class="friends tab" alt="friends icon" />
              <span>Friends</span>
            </a>
        </div>
          <div dataset="add-post" class="add-post" title="add post">
            <div></div>
            <div></div>
            <span>Post</span>
        </div>
          <div dataset="chat" title="chat">
            <a href="/messages">
            <img src="images/chat.png" class="chat tab" alt="chat icon"/>
              <span>Messages</span>
            </a>
        </div>
          <div dataset="search" title="search">
            <a href="/search">
            <img src="images/search.png" class="search tab"  alt="search icon"/>
              <span>Search</span>
            </a>
        </div>
          </div>
  <section class="notifier"></section>
   <div id="media-viewer" class="hidden">
        <button id="mv-closer">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <button id="mv-left" class="mover">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button id="mv-right" class="mover">
          <i class="fa-solid fa-chevron-right"></i>
          </button>
        <div id="viewer">
            <img id="image-view" src="#" alt="image in view" />
        </div>
        <div id="media-counter"></div>
   </div>
  <div id="post-menu-container">
        <div id="p-closer-space"></div>
        <div id="post-menu">
            <i class="fa-solid fa-xmark" id="p-closer-btn"></i>
         <button id="add-friend-btn"><i class="fa-solid fa-user-plus"></i>Add Author as friend</button>
         <button id="view-user-btn"><i class="fa-solid fa-user"></i>View Author's profile</button>
        <button id="delete-post-btn"><i class="fa-solid fa-trash"></i> Delete post</button>
       
        <button id="share-post-btn"><i class="fa-solid fa-share"></i> Share post</button>
        </div>
  </div>
  <script src="/scripts/index.js"></script>
  <script src="/scripts/home.js"></script>
</body>
</html>
